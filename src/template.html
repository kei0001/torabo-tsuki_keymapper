<style>

    --key: #232833; --key-edge: #3b4250; --key-trans: #1b1f27; --accent: #8fa0ff; --accent-soft: #252c55;
    --warn: #f0b45c; --warn-bg: #33270f; --err: #ff8a7a; --err-bg: #3a1714; --ok: #6fd39b;

  }
}
:root[data-theme="dark"] {
  --bg: #111419; --panel: #181c23; --sunk: #0d1014; --ink: #e5e8ee; --muted: #8e97a7; --line: #2a303b;
  --key: #232833; --key-edge: #3b4250; --key-trans: #1b1f27; --accent: #8fa0ff; --accent-soft: #252c55;
  --warn: #f0b45c; --warn-bg: #33270f; --err: #ff8a7a; --err-bg: #3a1714; --ok: #6fd39b;

* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1380px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 48px; display: grid; gap: 14px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; margin: 0; }
.brand small { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--key-edge); }

/* main grid */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } }
.plate { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; min-width: 0; }
.layers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.ltab { --h: 250; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 12px 3px 8px; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.ltab .dot { width: 9px; height: 9px; border-radius: 50%; background: oklch(var(--lc) var(--lch) var(--h)); }
.ltab .idx { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.ltab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ltab[aria-selected="true"] .idx { color: inherit; opacity: .7; }
.ltab input { width: 9em; border: 0; background: transparent; padding: 0; outline: none; }
.layer-tools { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }

.boardwrap { position: relative; overflow-x: auto; }
.board { position: relative; margin: 6px auto 0;
  background-image: radial-gradient(circle, var(--line) 1px, transparent 1.2px);
  background-size: var(--s) var(--s); background-position: calc(var(--s) * -.5) calc(var(--s) * -.5); border-radius: 8px; }
.key { position: absolute; border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 7px; background: var(--key);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; text-align: center;
  user-select: none; cursor: pointer; transition: box-shadow .12s, background .12s; overflow: hidden; }
.key:hover { box-shadow: 0 0 0 2px var(--accent-soft); }
.key.sel { box-shadow: 0 0 0 2.5px var(--accent); z-index: 2; }
.key.trans { background: var(--key-trans); border-style: dashed; border-bottom-width: 1px; }
.key .tap { font-weight: 600; font-size: calc(var(--s) * .27); line-height: 1.05; max-width: 100%; overflow-wrap: anywhere; }
.key .tap.long { font-size: calc(var(--s) * .17); }
.key .tap.xlong { font-size: calc(var(--s) * .13); }
.key .hold { font-family: var(--f-mono); font-size: calc(var(--s) * .17); color: var(--accent); line-height: 1.1; margin-top: 2px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.key .hold.layer { color: oklch(var(--lc) var(--lch) var(--h)); font-weight: 600; }
.key.ht { border-bottom-color: var(--accent); }
.key.ht.std { border-bottom-color: var(--warn); }
.key.ht.std .hold { color: var(--warn); }
.key.lay { background: color-mix(in oklch, var(--key) 82%, oklch(var(--lc) var(--lch) var(--h))); }
.key .pos { position: absolute; top: 2px; left: 4px; font-family: var(--f-mono); font-size: calc(var(--s) * .105); color: var(--muted); opacity: .8; }
.key .tr { font-size: calc(var(--s) * .2); color: var(--muted); opacity: .55; }
.key .tr small { display: block; font-size: calc(var(--s) * .12); }
.key.drop { box-shadow: 0 0 0 2.5px var(--ok); }
.board.picking .key { opacity: .55; }
.board.picking .key.picked { opacity: 1; background: var(--accent); color: var(--panel); border-color: var(--accent); }
.board.picking .key.picked .hold, .board.picking .key.picked .pos { color: var(--panel); }
.board.picking .key.owner { opacity: 1; box-shadow: 0 0 0 2.5px var(--warn); }
.pickbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin-top: 10px; font-size: 13px; }
.pickbar b { font-family: var(--f-mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 10px; }
.legend i { display: inline-block; width: 18px; height: 0; border-bottom: 3px solid var(--accent); vertical-align: middle; margin-right: 5px; }
.legend i.std { border-color: var(--warn); }

/* inspector */
.insp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; position: sticky; top: env(safe-area-inset-top, 0px); }
@media (max-width: 980px) { .insp { position: static; } }
.insp h2, .drawer h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
.insp .where { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.insp .where strong { font-family: var(--f-display); font-size: 20px; font-weight: 800; }
.insp .where span { color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); font-size: 13px; display: grid; gap: 8px; }
.empty kbd, .kbd { font-family: var(--f-mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--bg); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12px; color: var(--muted); }
select, input[type="text"], input[type="number"], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; width: 100%; min-width: 0; }
input[type="number"] { font-family: var(--f-mono); }
.desc { font-size: 12.5px; color: var(--muted); }
.params { display: grid; gap: 8px; }
.chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; text-align: left; }
.chip .big { font-weight: 700; font-size: 16px; }
.chip code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.chip[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.stack { display: grid; gap: 6px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.across { display: grid; gap: 2px; font-size: 12px; }
.across button { display: grid; grid-template-columns: 1.6em 1fr; gap: 6px; text-align: left; border: 0; background: transparent; padding: 2px 4px; border-radius: 5px; }
.across button:hover { background: var(--bg); }
.across button[aria-current="true"] { background: var(--accent-soft); }
.across code { font-family: var(--f-mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.across .n { font-family: var(--f-mono); color: var(--muted); }

/* palette */
.palette { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px; display: grid; gap: 8px; }
.palette .groups { max-height: 300px; overflow-y: auto; display: grid; gap: 8px; padding-right: 2px; }
.palette .g h3 { font-size: 11px; color: var(--muted); margin: 0 0 4px; font-weight: 600; letter-spacing: .04em; }
.palette .keys { display: flex; flex-wrap: wrap; gap: 4px; }
.palette .keys button { min-width: 2.2em; border: 1px solid var(--key-edge); border-bottom-width: 2px; background: var(--key); border-radius: 6px; padding: 1px 6px; font-size: 12.5px; }
.palette .keys button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.modt { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.modt button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.modt button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.capture[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }

/* drawers */
.drawer { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.dtabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dtabs button { border: 0; background: transparent; padding: 7px 12px; border-bottom: 2px solid transparent; color: var(--muted); font-size: 13.5px; margin-bottom: -1px; }
.dtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.dtabs .count { font-family: var(--f-mono); font-size: 11px; background: var(--sunk); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
.dtabs .count.warn { background: var(--warn-bg); color: var(--warn); }
.dtabs .count.err { background: var(--err-bg); color: var(--err); }
.dbody { padding: 14px; display: grid; gap: 12px; min-width: 0; }

.issues { display: grid; gap: 8px; }
.issue { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.issue .sev { font-family: var(--f-mono); font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.issue.warn .sev { background: var(--warn-bg); color: var(--warn); }
.issue.err .sev { background: var(--err-bg); color: var(--err); }
.issue.info .sev { background: var(--sunk); color: var(--muted); }
.issue p { margin: 0; }
.issue p + p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.issue .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .issue { grid-template-columns: auto minmax(0, 1fr); } .issue .acts { grid-column: 1 / -1; justify-content: flex-start; } }
.allgood { color: var(--ok); font-weight: 600; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 12px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.card header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card header .kind { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.card header .ref { font-family: var(--f-mono); font-weight: 600; font-size: 15px; }
.card header .use { margin-left: auto; font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.check { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.poslist { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tdstep { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.tdstep .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 7px; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 12.5px; color: var(--muted); max-width: 70ch; }
.hint code, .issue code, .desc code { font-family: var(--f-mono); font-size: .92em; background: var(--sunk); padding: 0 4px; border-radius: 4px; }

.out { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
@media (max-width: 900px) { .out { grid-template-columns: minmax(0, 1fr); } }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 14px; font-family: var(--f-mono); font-size: 12px; line-height: 1.5; overflow: auto; max-height: 560px; min-width: 0; }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; font-size: 13px; }

/* overlay */
.overlay { position: fixed; inset: 0; background: rgb(10 12 16 / .45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(760px, 100%); max-height: 90vh; overflow: auto; padding: 18px; display: grid; gap: 12px; }
.modal h2 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.modal textarea { font-family: var(--f-mono); font-size: 12px; min-height: 280px; }
.err-text { color: var(--err); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
"use strict";
const STORE_KEY = 'tsuki-keymap-bench-v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv; } }
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(c));
  return el;
}

/* ---------- geometry ---------- */
const THUMBS = new Set([56, 57, 58, 59, 60, 61]);
const LEFT = (() => {
  const k = LAYOUTS.L, cx = k.map(a => a[2] + a[0] / 2);
  const mid = (Math.min(...cx) + Math.max(...cx)) / 2;
  return cx.map(x => x < mid);
})();
function layoutKeys(name) {
  const keys = LAYOUTS[name];
  const out = [];
  if (name === 'L') keys.forEach((k, i) => out.push({ pos: i, k }));
  else LAYOUTS[name + 'map'].forEach((li, pos) => { if (li < keys.length) out.push({ pos, k: keys[li] }); });
  return out;
}
const presentSet = name => new Set(layoutKeys(name).map(o => o.pos));
// ZMK compares combo / hold-trigger positions against the *selected* physical layout's numbering,
// while the keymap itself stays in the stock (L) numbering. Convert on export / import.
const toRuntime = (p, lay) => { if (lay === 'L') return p; const li = LAYOUTS[lay + 'map'][p]; return li < LAYOUTS[lay].length ? li : null; };
const fromRuntime = (n, lay) => { if (lay === 'L') return n; const i = LAYOUTS[lay + 'map'].indexOf(n); return i < 0 ? null : i; };
const posOut = (arr) => arr.map(p => toRuntime(p, S.layout)).filter(x => x != null);
const HOME_ROW = new Set([24, 25, 26, 27, 28, 29, 32, 33, 34, 35, 36, 37]);

/* ---------- behaviors ---------- */
const BUILTIN = {
  kp: { name: 'キー', params: ['key'], desc: 'タップでキーを送る。' },
  mt: { name: 'Mod-Tap（標準 &mt）', params: ['mod', 'key'], ht: true, desc: 'タップでキー、ホールドで修飾。標準設定は hold-preferred / 200ms なので、速く打つと修飾として判定されやすい。' },

    if (b.type !== 'raw' && !usesBeh(x => x.beh === b.label)) out.push({ sev: 'info', msg: `<code>&amp;${esc(b.label)}</code> はどのキーにも割り当てられていない`, sub: 'Studioから割り当てる予定なら問題なし。' });

  });

        numField(`ct-${ci}`, 'timeout-ms', c.timeout, v => { c.timeout = v; commit(); }, '50')),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, '① 同時押しするキー（上のキーボードの図でクリックして選ぶ）'),
        h('div', { class: 'row' }, ...(c.positions.length ? c.positions.map(p => h('span', { class: 'kbd', style: { fontSize: '13px', padding: '2px 8px' } }, `${face(S.layers[0].bindings[p] || { beh: 'none', params: [] }).tap || '・'}  ${p}`)) : [h('span', { class: 'hint' }, 'まだ選んでない')])),
        h('div', { class: 'row' }, h('button', { class: 'btn sm' + (picking ? ' primary' : ''), onclick: () => { ui.pick = picking ? null : { kind: 'combo', i: ci }; render(); if (!picking) $('#board').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }, picking ? '選び終わった' : 'キーボードの図で選ぶ'),
          c.positions.length ? h('button', { class: 'btn ghost sm', onclick: () => { c.positions = []; commit(); } }, 'クリア') : null)),
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, '② 同時押ししたときに送る動作'),
        bindingEditor(`combo-${ci}`, () => S.combos[ci].binding, nb => { S.combos[ci].binding = nb; commit(); })));
    const lw = h('div', { class: 'row', style: { gap: '12px' } });
    S.layers.forEach((l, li) => { const cb = h('input', { type: 'checkbox', id: `cl-${ci}-${li}`, checked: c.layers.includes(li), onchange: () => { c.layers = cb.checked ? [...c.layers, li].sort() : c.layers.filter(x => x !== li); commit(); } }); lw.append(h('label', { class: 'check', for: `cl-${ci}-${li}` }, cb, `${li}: ${l.name}`)); });
    card.append(h('div', { class: 'field' }, h('span', { class: 'lbl' }, '有効なレイヤー（全部オフ＝全レイヤー）'), lw));
    cards.append(card);
  });
  if (!S.combos.length) cards.append(h('p', { class: 'hint' }, 'コンボはまだない。'));
  w.append(cards);
  return w;
}
function viewOut() {
  const text = generate();
  const pre = h('pre', { class: 'code', id: 'outCode', tabindex: '0' }, text);
  const copy = h('button', { class: 'btn primary', onclick: async () => {
    try { await navigator.clipboard.writeText(text); toast('.keymap をコピーした'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('選択した。⌘C でコピー'); }
  } }, 'コピー');
  return h('div', { class: 'out' }, h('div', { class: 'stack', style: { minWidth: 0 } }, h('div', { class: 'row' }, copy, h('span', { class: 'hint' }, `${text.split('\n').length} 行 ・ ${S.layers.length} レイヤー ・ behavior ${S.behaviors.length}`)), pre),
    h('div', { class: 'stack' }, h('h2', {}, '反映の手順'), h('ol', { class: 'steps', html:
      '<li>コピーして zmk-config の <code>config/〜.keymap</code> を丸ごと置き換え、push。</li>' +
      '<li>GitHub Actions のビルドが緑になるのを確認（赤ならエラー内容を見る）。</li>' +
      '<li>キーマップはセントラル側だけが持っているので、<code>right_central</code> のUF2を焼けばOK。</li>' +
      '<li><b>Studio の物理レイアウトは「' + S.layout + ' Layout」にしておく</b>。コンボとホールド判定キーの番号はこのレイアウト基準で書き出している（ZMKはこの2つを選択中レイアウトの番号で照合するため）。</li>' +
      '<li><b>ZMK Studio で一度保存したことがあるなら「Restore Stock Settings」</b>。やらないとStudioの保存内容が優先されて、新しいキーマップが反映されない。</li>' }),
      h('p', { class: 'hint', html: 'keymap-editor（nickcoutsos）で同じファイルを開いても読める形式で出している。ただし向こうで保存すると、ここで付けた並びやコメントは向こうの整形に変わる。' })));
}

/* ---------- import modal ---------- */
function renderModal() {
  const root = $('#overlayRoot'); root.innerHTML = '';
  if (!ui.modal) return;
  const ta = h('textarea', { id: 'importText', spellcheck: 'false', placeholder: '#include <behaviors.dtsi>\n...\n/ {\n    keymap {\n        ...' });
  const errEl = h('p', { class: 'err-text', role: 'alert' });
  const file = h('input', { type: 'file', id: 'importFile', accept: '.keymap,.dtsi,.overlay,.txt', onchange: () => {
    const f = file.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { ta.value = r.result; }; r.readAsText(f);
  } });
  const doImport = () => {
    try { const st = parseKeymap(ta.value); st.layout = S.layout; S = st; ui.layer = 0; ui.sel = null; ui.pick = null; ui.modal = null; commit(); toast(`読み込んだ：${S.layers.length} レイヤー、behavior ${S.behaviors.length}`); }
    catch (e) { errEl.textContent = '読み込めなかった：' + e.message; }
  };
  const close = () => { ui.modal = null; render(); };
  const modal = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'impTitle' },
    h('h2', { id: 'impTitle' }, '.keymap を読み込む'),
    h('p', { class: 'hint', style: { margin: 0 } }, 'zmk-config の .keymap を貼り付けるか、ファイルを選ぶ。今の編集内容は置き換わる（⌘Zで戻せる）。'),
    h('div', { class: 'row' }, file), ta, errEl,
    h('div', { class: 'row', style: { justifyContent: 'space-between' } },
      h('button', { class: 'btn ghost', onclick: () => { try { const st = parseKeymap(INITIAL); st.layout = S.layout; S = st; ui.layer = 0; ui.sel = null; ui.pick = null; ui.modal = null; commit(); toast('UF2から復元した配列に戻した'); } catch (e) { errEl.textContent = e.message; } } }, 'UF2（10/11）から復元した配列に戻す'),
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: close }, 'キャンセル'), h('button', { class: 'btn primary', onclick: doImport }, '読み込む'))));
  const ov = h('div', { class: 'overlay', onclick: e => { if (e.target === ov) close(); } }, modal);
  root.append(ov); setTimeout(() => ta.focus());
}

/* ---------- main ---------- */
function render() {
  if (ui.sel != null && !(ui.sel in (S.layers[ui.layer]?.bindings || []))) ui.sel = null;
  renderTop(); renderLayers(); renderBoard(); renderInsp(); renderDrawer(); renderModal();
}
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
$('#importBtn').onclick = () => { ui.modal = 'import'; render(); };
$('#exportBtn').onclick = () => { ui.tab = 'out'; render(); $('#dbody').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
document.addEventListener('keydown', e => {
  if (ui.capture) return;
  const t = e.target, typing = t.closest && t.closest('input, textarea, select');
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (typing) return;
  if (e.key === 'Escape') { if (ui.modal) { ui.modal = null; render(); return; } ui.pick = null; ui.sel = null; ui.palette = null; render(); return; }
  if (ui.sel == null || ui.pick) return;
  const L = S.layers[ui.layer].bindings;
  if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); L[ui.sel] = { beh: 'trans', params: [] }; commit(); }
  else if (mod && e.key.toLowerCase() === 'c') { ui.clip = JSON.parse(JSON.stringify(L[ui.sel])); toast('コピーした：' + bindingText(ui.clip)); }
  else if (mod && e.key.toLowerCase() === 'v' && ui.clip) { e.preventDefault(); L[ui.sel] = JSON.parse(JSON.stringify(ui.clip)); commit(); }
});
load();
render();
let rT; new ResizeObserver(() => { const w = $('#boardwrap').clientWidth; if (Math.abs(w - boardW) > 2) { boardW = w; clearTimeout(rT); rT = setTimeout(renderBoard, 30); } }).observe($('#boardwrap'));
</script>
